<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="Web/manifest.webmanifest"><link rel="apple-touch-icon" href="Web/apple_touch_icon.png"><link rel="icon" href="Web/icon_192.png"><meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#1a1d21" media="(prefers-color-scheme: dark)"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="kcal"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>4000 kcal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap">
<style>
/* Layout: plain document table — sticky day strip on top, one row per meal with option blocks as columns, sticky day total at the bottom */
:root{
  --bg:#f5f6f7; --surface:#ffffff; --line:#d5d9de; --line-strong:#9aa2ab;
  --fg:#15181c; --muted:#5d6670; --accent:#1d4ed8; --sel:#edf2ff; --hover:rgba(21,24,28,.07);
  --ok:#1b7a4a; --warn:#a15c00; --err:#b42318; --low:#a5564e;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#1a1d21; --line:#2e343b; --line-strong:#56606b;
  --fg:#e7e9ec; --muted:#98a1ab; --accent:#4d8dff; --sel:#262a31; --hover:rgba(231,233,236,.08);
  --ok:#5fd095; --warn:#f0b35a; --err:#ff8a7a; --low:#dd978e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1a1d21; --line:#2e343b; --line-strong:#56606b;
  --fg:#e7e9ec; --muted:#98a1ab; --accent:#4d8dff; --sel:#262a31; --hover:rgba(231,233,236,.08);
  --ok:#5fd095; --warn:#f0b35a; --err:#ff8a7a; --low:#dd978e; color-scheme:dark}

[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45}
.wrap{max-width:1500px;margin:0 auto;padding:18px 16px 230px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
/* Logo: digits in the number font, the word in the logo font (Space Grotesk, as in the app icon) */
h1.logo{margin:0;text-align:center;font-size:30px;line-height:1.1;white-space:nowrap}
h1.logo .ln{font-family:var(--mono);font-weight:600;letter-spacing:-.04em}
h1.logo .lw{font-family:"Space Grotesk",var(--sans);font-weight:700;letter-spacing:-.045em}
.tools{display:flex;align-items:center;gap:8px}
/* Header: plain icons for refresh/export, large pill for Einkauf (its cart matches the icon size) */
.ibtn{all:unset;display:grid;place-items:center;width:44px;height:44px;color:var(--fg);cursor:pointer;-webkit-tap-highlight-color:transparent}
.ibtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ibtn svg{width:27px;height:27px}
#openExport .ico-x{display:none}
#openExport.open .ico-up{display:none}
#openExport.open .ico-x{display:block}
/* Export open: the sticky header keeps only refresh, logo and the close icon */
body.exporting .days{display:none}
#refreshBtn .rot{transform-box:view-box;transform-origin:12px 12px}
@media (max-width:440px){h1.logo{font-size:27px}}
#refreshBtn.spin .rot{animation:rst-spin .75s cubic-bezier(.6,0,.4,1) infinite}
.tbtn{font:inherit;font-size:14.5px;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);cursor:pointer}
.tbtn:hover{border-color:var(--line-strong)}
.tbtn:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tbtn svg{width:16px;height:16px}

/* Floating day strip: no background or divider, chips touch, today is centred (spacers allow centring the first/last day) */
:root{padding-top:0}
.head{position:sticky;top:0;z-index:5;background:var(--surface);margin:-18px -16px 0;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0}
.days{margin:10px -16px 0;border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.days-scroll{position:relative;display:flex;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;background:linear-gradient(90deg,var(--surface) 50%,var(--bg) 50%)}
/* the container background shows during overscroll: grey continues endlessly right of today */
.day-pad{flex:0 0 calc(50% - 62px);display:flex;justify-content:flex-end;overflow:hidden}
.day-pad.right{background:var(--bg)}
.day-pad .day.fill{flex:none}
.days-scroll::-webkit-scrollbar{display:none}
.day.fill{cursor:default;pointer-events:none}
.day{all:unset;position:relative;isolation:isolate;cursor:pointer;flex:none;width:124px;scroll-snap-align:center;box-sizing:border-box;padding:11px 16px 15px;border-right:1px solid color-mix(in srgb,var(--line) 55%,transparent);background:var(--surface);display:flex;flex-direction:column;gap:1px}
.day:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.day .d1{font-size:14.5px;color:var(--muted)}
.day .d2{font-family:var(--mono);font-weight:500;font-size:21px;line-height:1.2;letter-spacing:-.03em;margin:1px 0}
.day .d3{font-size:14.5px;color:var(--muted)}
.day.saved .d3{color:var(--fg)}
.day .d3.ok{color:var(--ok)}
.day .d3.low{color:var(--low)}
.day.cur{background:var(--sel)}
.day.cur::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent)}
.day.cur .d2{font-weight:600}

#dbNote{color:var(--muted);font-size:13.5px;margin:0 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.login{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%}
.login span{flex:1 1 100%}
.login input{font:inherit;font-size:14px;height:46px;box-sizing:border-box;padding:0 16px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);flex:1 1 160px;min-width:0}
.login input:focus{outline:2px solid var(--accent);outline-offset:-1px}

.modebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:18px 0 14px;min-height:46px}
.dayhead{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.dayhead b{font-size:17px;font-weight:600;color:var(--fg)}
.dayhead>span{font-size:13.5px;color:var(--muted)}
.modebar .dayhead b{font-size:22px;letter-spacing:-.01em}
/* Pill buttons: .btn 46px (actions), .btn.big 52px */
.btn{font:inherit;font-size:16px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 22px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600;padding:0 26px}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.5;cursor:default}
.saverow{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:8px}
#saveMsg{font-size:14.5px}
#saveMsg:empty{display:none}
#saveMsg.err{color:var(--fg)}

.row{position:relative;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface);margin-bottom:14px;padding-left:5px}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:transparent}
.row.has-sel::before{background:var(--accent)}
.row-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:10px 12px;border-bottom:1px solid var(--line)}
.row-head h2{font-size:17px;font-weight:600;margin:0}
.row-head .sub{color:var(--muted);font-size:13.5px}
.row-head .target{margin-left:auto;color:var(--muted);font-size:13.5px}
.blocks{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(286px,304px);overflow-x:auto}
.block{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.block:last-child{border-right:0}
.block.on{background:var(--sel);box-shadow:inset 0 3px 0 var(--accent)}
.frozen .block{background:var(--surface);box-shadow:none;border-right:1px solid var(--line)}
.empty{padding:14px 12px;color:var(--muted)}
.b-top{display:flex;align-items:flex-start;gap:4px;padding:8px 8px 0 0}
.b-head{all:unset;cursor:pointer;display:flex;gap:9px;align-items:flex-start;padding:3px 0 4px 12px;flex:1;min-width:0}
.b-head:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.frozen .b-head{cursor:default;padding-left:12px}
.box{flex:none;width:16px;height:16px;border:1.5px solid var(--line-strong);margin-top:2px;display:grid;place-items:center}
.on .box{border-color:var(--accent);background:var(--accent)}
.on .box::after{content:"";width:8px;height:4px;border:2px solid var(--surface);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.b-name{font-weight:600}
.rst{all:unset;flex:none;width:28px;height:28px;display:grid;place-items:center;color:var(--fg);cursor:pointer;-webkit-tap-highlight-color:transparent}
.rst:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.rst svg{width:19px;height:19px;overflow:visible}
.rst .rot{transform-box:view-box;transform-origin:12px 12px}
.rst.spin .rot{animation:rst-spin .75s cubic-bezier(.6,0,.4,1)}
@keyframes rst-spin{to{transform:rotate(360deg)}}
.b-meta{padding:0 12px 8px 37px;color:var(--muted);font-size:13.5px;display:flex;flex-direction:column}
.frozen .b-meta{padding-left:12px}
.b-meta b{color:var(--fg);font-weight:500}
table.items{width:100%;border-collapse:collapse;font-size:14.5px}
.items td{border-top:1px solid var(--line);padding:5px 6px;vertical-align:top}
.items td:first-child{padding-left:12px}
.items td:last-child{padding-right:12px;text-align:right;white-space:nowrap}
.items .hint{display:block;color:var(--muted);font-size:13.5px;white-space:pre-line}
.q{display:flex;align-items:center;gap:3px;white-space:nowrap}
.q input{width:52px;font:inherit;font-family:var(--mono);font-size:13.5px;text-align:right;padding:2px 5px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.q input:focus{outline:2px solid var(--accent);outline-offset:-1px}
@media (pointer:coarse){.q input{font-size:16px;width:60px}.login input{font-size:16px}body:has(.q input:focus,.login input:focus) .bar{display:none}}
.q span{color:var(--muted);font-size:13.5px;min-width:20px}
.blocks.edit{grid-template-columns:repeat(var(--n),minmax(286px,304px)) var(--last,80px) var(--trash,0px)}
.trashcol .trash{animation:trash-in .25s ease}
@keyframes trash-in{from{opacity:0;transform:translateX(20px)}}
.addcol{display:grid}
.add{all:unset;display:grid;place-items:center;min-height:120px;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
.add:hover{color:var(--fg)}
.add:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.add svg{width:22px;height:22px}
.trashcol{display:grid;overflow:hidden;min-width:0;border-right:0;box-shadow:inset 1px 0 var(--line)}
.blocks.edit>.block:nth-last-child(2){border-right:0}
.trash{all:unset;display:grid;place-items:center;min-height:120px;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
.trash:hover{color:var(--fg)}
.trash:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.trash svg{width:22px;height:22px}
/* iOS 26 style confirmation, measured from the reference screenshot (3x): card 8px from the screen edges, ~26px radius,
   message 22/28px regular at 85% ink inset 24px, buttons 46px capsules inset 8px with 8px gap, label 20px semibold, action blue #3F8EF7 */
.alert-bg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.3);display:grid;place-items:center;padding:8px}
.alert{box-sizing:border-box;width:min(440px,calc(100vw - 16px));border-radius:26px;padding:22px 8px 8px;background:rgba(246,246,248,.82);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);box-shadow:0 18px 60px rgba(0,0,0,.25);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",var(--sans);animation:alert-in .22s cubic-bezier(.2,.9,.3,1.15)}
.alert p{font-size:22px;line-height:28px;font-weight:400;margin:0 16px 23px;color:rgba(0,0,0,.85);letter-spacing:-.01em}
.alert:focus{outline:none}
.alert-btns{display:flex;flex-direction:column;gap:8px}
.alert-btns button{all:unset;box-sizing:border-box;width:100%;height:46px;border-radius:999px;background:rgba(0,0,0,.07);color:#000;font-size:20px;font-weight:600;letter-spacing:-.01em;text-align:center;line-height:46px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.alert-btns button.primary{background:#3F8EF7;color:#fff}
.alert-btns button:active{filter:brightness(.92)}
.alert-btns button:focus-visible{outline:2px solid #3F8EF7;outline-offset:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .alert{background:rgba(44,42,46,.78)}:root:not([data-theme="light"]) .alert p{color:rgba(255,255,255,.85)}:root:not([data-theme="light"]) .alert-btns button{background:rgba(255,255,255,.12);color:#fff}:root:not([data-theme="light"]) .alert-btns button.primary{background:#3F8EF7}}
:root[data-theme="dark"] .alert{background:rgba(44,42,46,.78)}:root[data-theme="dark"] .alert p{color:rgba(255,255,255,.85)}:root[data-theme="dark"] .alert-btns button{background:rgba(255,255,255,.12);color:#fff}:root[data-theme="dark"] .alert-btns button.primary{background:#3F8EF7}
@keyframes alert-in{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.block.pick{position:relative;min-height:380px}
.pick-in{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain}
.dish{border-bottom:1px solid var(--line)}
.shop-list.pick-list{padding:10px 12px 12px}
.shop-list.pick-list li{padding:0}
.pick-list button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:12px;width:100%;padding:3px 0}
.pick-list button:focus-visible{outline:2px solid var(--accent)}
.pick-list button.on{color:var(--accent);font-weight:600}
.vorrat .vrow{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0;cursor:pointer}
.vorrat .vrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vorrat .vrow .box{margin-top:0}
.block:not(.on) .vrow .box{visibility:hidden}
.block:not(.on) .vrow{cursor:default;pointer-events:none}
.vorrat .vrow:not(.on) .box{border-color:var(--line-strong);background:none}
.vorrat .vrow:not(.on) .box::after{content:none}
.vorrat{color:var(--muted);font-size:13.5px;padding:6px 12px 10px;border-top:1px solid var(--line);margin-top:auto}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line-strong);padding:18px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:16px}
.bar-info{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:4px 22px}
.bar .big{font-size:18px;font-weight:600}
/* Meter: 3/4 width, centred, fully rounded; the 4.000 mark is a small rounded capsule */
.meter{width:75%;height:10px;border-radius:999px;background:var(--line);position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--muted)}
.meter i.ok{background:var(--ok)}
.meter i.low{background:var(--low)}
.meter b{position:absolute;top:-8px;bottom:-8px;width:12px;margin-left:-6px;border-radius:999px;background:var(--fg);border:3px solid var(--surface);box-sizing:border-box;left:calc(100%/1.15)}
.status.ok{color:var(--ok)} .status.low{color:var(--low)}
.bar .lbl{color:var(--muted);font-size:13.5px}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .25s}}

.view{display:flex;flex-direction:column;gap:14px;margin:18px 0 0}
.view-head{display:flex;align-items:center;gap:10px}
.view h2{font-size:22px;letter-spacing:-.01em;margin:0;flex:1}
.view .sub{color:var(--muted);font-size:13.5px;margin:0}
.view .dayhead{flex:none}
.view .dayhead b{font-size:22px;letter-spacing:-.01em}
.shop-list{list-style:none;margin:0;padding:0}
.shop-list li{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.shop-list li+li:not(.gap){border-top:1px solid color-mix(in srgb,var(--line) 45%,transparent)}
.shop-list li.gap{margin-top:18px}
.shop-list li span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.view textarea{width:100%;min-height:220px;font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);padding:10px;box-sizing:border-box}
.shopview{display:flex;flex-direction:column;gap:14px}
.shopview .sub{color:var(--muted);font-size:13.5px;margin:0}
.mb-actions{display:flex;gap:8px;margin-left:auto}
.btn .cart{width:22px;height:22px;flex:none;margin-right:8px}
.btn.shop{width:150px;padding:0}
.view-actions,.shopview .view-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{font-size:13.5px;color:var(--muted)}
/* feedback stays neutral: colour is reserved for the kcal goal */
/* Verlauf: stat tiles, three single-series bar charts on one axis each, table view */
.msg.err{color:var(--fg)}
</style>

<div class="wrap">
  <header class="head">
  <div class="top">
    <button class="ibtn" id="refreshBtn" type="button" title="Neu laden" aria-label="Neu laden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="rot"><g transform="translate(12 12) scale(.88) translate(-12 -12)"><path d="M3.3 9.7A9 9 0 0 1 12 3a9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3.1V8h-4.9"/><path d="M20.7 14.3A9 9 0 0 1 12 21a9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M7.9 16H3v4.9"/></g></g></svg></button>
    <h1 class="logo"><span class="ln">4000</span> <span class="lw">kcal</span></h1>
    <button class="ibtn" id="openExport" type="button" title="Export" aria-label="Alle gespeicherten Tage exportieren"><svg class="ico-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15.5V3M6.5 8.5 12 3l5.5 5.5M3.5 14v5.5c0 .8.7 1.5 1.5 1.5h14c.8 0 1.5-.7 1.5-1.5V14"/></svg><svg class="ico-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M5.5 5.5l13 13M18.5 5.5l-13 13"/></svg></button>
  </div>
  <nav class="days" aria-label="Tage"><div class="days-scroll" id="days"></div></nav>
  </header>

  <p id="dbNote" hidden></p>

  <section class="view" id="expSheet" aria-labelledby="expTitle" hidden>
    <div class="view-head"><h2 id="expTitle">Export</h2></div>
    <div class="dayhead"><b id="expSub"></b><span id="expLast"></span></div>
    <div class="view-actions">
      <button class="btn primary" type="button" id="saveCsv">CSV herunterladen</button>
      <button class="btn" type="button" id="copyCsv">Kopieren</button>
      <span class="msg" id="expMsg" aria-live="polite"></span>
    </div>
    <textarea id="csvBox" readonly aria-label="CSV-Vorschau"></textarea>
  </section>
  <div id="mainView">
  <div class="modebar" id="modebar"></div>
  <section class="shopview" id="shopSheet" aria-label="Einkaufsliste" hidden>
    <ul class="shop-list" id="shopList"></ul>
    <p class="sub" id="shopVorrat"></p>
    <div class="view-actions"><button class="btn" type="button" id="copyShop">Kopieren</button><span class="msg" id="shopMsg" aria-live="polite"></span></div>
  </section>
  <div id="rows"></div>
  <div class="saverow" id="saverow"></div>

function itemsTable(items,editable,bid,all){
  return `<table class="items"><tbody>${items.filter(it=>all||!it.v).map(it=>`<tr><td>${esc(it.n)}<span class="hint" data-h="${it.i}">${numify(hintFor(it.f,it.q))}</span></td>
    <td>${editable?`<label class="q"><input id="q-${bid}-${it.i}" type="number" min="0" step="${it.u==='Stk'?0.5:5}" data-i="${it.i}" value="${it.q}" aria-label="${esc(it.n)} Menge"><span>${it.u}</span></label>`:`<span class="num">${fmt(it.q)}</span> <span class="hint" style="display:inline">${it.u}</span>`}</td>
    <td class="num" data-ik="${it.i}">${fmt(Math.round(it.kcal))}</td></tr>`).join('')}</tbody></table>`;
}
function vorratText(items){const v=items.filter(it=>it.v&&it.use!==0);return v.length?'Inklusive Vorrat: '+v.map(it=>`${fmt(it.q)} ${it.u} ${it.n} (+${fmt(Math.round(it.kcal))} kcal)`).join(', '):''}

// Trash column: hidden (0 px) until the row is scrolled to its end and pushed further; scrolling back hides it again.
// It is the only way to leave a meal row empty, and asks first.
const TRASH_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6h17M9 6V4.5c0-.8.7-1.5 1.5-1.5h3c.8 0 1.5.7 1.5 1.5V6M18.5 6l-.8 13.1a2 2 0 0 1-2 1.9H8.3a2 2 0 0 1-2-1.9L5.5 6M10 10.5v6M14 10.5v6"/></svg>';
function trashEl(r,d,wrap){
  const el=document.createElement('article');el.className='block trashcol';
  el.innerHTML=`<button class="trash" type="button" tabindex="-1" title="Gericht entfernen" aria-label="${r.name}, Gericht entfernen">${TRASH_SVG}</button>`;
  el.querySelector('.trash').addEventListener('click',async()=>{if(!d.sel[r.id]){wrap.dispatchEvent(new Event('trash-hide'));return}
    if(!await confirmAlert(`Soll das Gericht aus ${r.name} entfernt werden?`,'Entfernen'))return;
    d.sel[r.id]=null;r.blocks.forEach(x=>{if(d.off[x.id]){delete d.off[x.id];paintBlock(x)}});d.touched=true;
    markSel(wrap,r,d);totals();wrap.dispatchEvent(new Event('trash-hide'))});
  return el;
}
// Pull distance needed past the end: wheel/trackpad 220 px accumulated, touch 110 px
function armTrash(wrap,allowed){
  let shown=false,anchor=0,tx=null,acc=0,accT=0;
  const atEnd=()=>wrap.scrollLeft+wrap.clientWidth>=wrap.scrollWidth-2;
  const show=()=>{if(shown||!allowed())return;shown=true;wrap.style.setProperty('--trash','80px');
    const t=wrap.querySelector('.trash');t.style.animation='none';void t.offsetWidth;t.style.animation='';
    requestAnimationFrame(()=>{wrap.scrollTo({left:wrap.scrollWidth,behavior:'smooth'});setTimeout(()=>{anchor=wrap.scrollWidth-wrap.clientWidth},400)})};
  const hide=()=>{if(!shown)return;shown=false;anchor=0;wrap.style.setProperty('--trash','0px')};
  wrap.addEventListener('wheel',e=>{const dx=e.deltaX||(e.shiftKey?e.deltaY:0);const now=Date.now();
    if(dx<=0||!atEnd()||now-accT>500)acc=0;accT=now;if(dx>0&&atEnd()){acc+=dx;if(acc>=220){acc=0;show()}}},{passive:true});
  wrap.addEventListener('touchstart',e=>{tx=atEnd()&&allowed()?e.touches[0].clientX:null},{passive:true});
  wrap.addEventListener('touchmove',e=>{if(tx!==null&&tx-e.touches[0].clientX>110){tx=null;show()}},{passive:true});
  wrap.addEventListener('scroll',()=>{if(shown&&anchor&&wrap.scrollLeft<anchor-50)hide()},{passive:true});
  wrap.addEventListener('trash-hide',hide);
}
function confirmAlert(text,ok){return new Promise(res=>{
  const bg=document.getElementById('alertBg');
  document.getElementById('alertM').textContent=text;bg.querySelector('[data-a="1"]').textContent=ok;
  bg.hidden=false;bg.querySelector('.alert').focus({preventScroll:true});
  const done=v=>{bg.hidden=true;bg.onclick=null;document.removeEventListener('keydown',key);res(v)};
  const key=e=>{if(e.key==='Escape')done(false)};document.addEventListener('keydown',key);
  bg.onclick=e=>{const b=e.target.closest('[data-a]');if(b)done(b.dataset.a==='1');else if(e.target===bg)done(false)};
})}
function markSel(wrap,r,d){wrap.querySelectorAll('.block').forEach(x=>{const o=x.id==='blk-'+d.sel[r.id];x.classList.toggle('on',o);
  const h=x.querySelector('.b-head');if(h)h.setAttribute('aria-checked',o);x.querySelectorAll('.vrow').forEach(v=>v.tabIndex=o?0:-1)});
  const sec=wrap.closest('.row');if(sec)sec.classList.toggle('has-sel',!!d.sel[r.id]);
  if(!d.sel[r.id])wrap.dispatchEvent(new Event('trash-hide'))}
function blockEl(r,d,wrap,b){
  const m=mealFromDraft(d,b);const on=d.sel[r.id]===b.id;
  const el=document.createElement('article');el.className='block'+(on?' on':'');el.id='blk-'+b.id;
  const side=`<button class="rst" type="button" title="Auf Standardwerte zurücksetzen" aria-label="${esc(b.name)} auf Standardwerte zurücksetzen">${RST_SVG}</button>`;
  el.innerHTML=`<div class="b-top"><button class="b-head" type="button" role="radio" aria-checked="${on}"><span class="box"></span><span class="b-name">${esc(b.name)}</span></button>${side}</div>
    <div class="b-meta"><span><b class="num" data-k>${fmt(m.kcal)}</b> kcal, <b class="num" data-p>${fmt(m.p)}</b> g Protein</span>${b.t?`<span>${numify(cap(b.t))}</span>`:''}</div>
    ${itemsTable(m.items,true,b.id)}
    ${m.items.some(it=>it.v)?'<div class="vorrat" data-v></div>':''}`;
  paintVorrat(el,b,m);
  el.querySelector('.b-head').addEventListener('click',()=>{if(d.sel[r.id]===b.id)return;d.sel[r.id]=b.id;d.touched=true;
    // A dish that is no longer selected forgets its pantry choice (back to all ticked)
    r.blocks.forEach(x=>{if(x.id!==d.sel[r.id]&&d.off[x.id]){delete d.off[x.id];paintBlock(x)}});
    saveDrafts();markSel(wrap,r,d);totals()});
  el.querySelector('.rst').addEventListener('click',e=>{
    const btn=e.currentTarget;btn.classList.remove('spin');void btn.offsetWidth;btn.classList.add('spin');
    delete d.q[b.id];delete d.off[b.id];d.touched=true;saveDrafts();
    el.querySelectorAll('input').forEach(inp=>inp.value=b.items[+inp.dataset.i][1]);paintBlock(b);totals();});
  el.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(isNaN(parseFloat(String(inp.value).replace(',','.'))))inp.value=qty(d,b,+inp.dataset.i)}));
  el.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',()=>{
    const v=parseFloat(String(inp.value).replace(',','.'));if(isNaN(v)||v<0)return;
    const i=+inp.dataset.i;
    const o=(d.q[b.id]=d.q[b.id]||{});
    if(v===b.items[i][1])delete o[i];else o[i]=v;
    if(!Object.keys(o).length)delete d.q[b.id];
    d.touched=true;saveDrafts();paintBlock(b);totals();}));
  return el;
}
// Custom column: narrow plus → one scroll unit inside the block: editable dish on top, ingredient list (shop-list look) below.
// Tapping an ingredient adds/removes it; the dish grows above the list, no auto-scroll. The cross deletes the dish.
function customEl(r,d,wrap){
  const b=customBlock(d,r.id);const open=picking.has(r.id)||b.items.length>0;
  wrap.style.setProperty('--last',open?'minmax(286px,304px)':'80px');
  const el=document.createElement('article');el.id='blk-'+b.id;
  if(!open){
    el.className='block addcol';
    el.innerHTML=`<button class="add" type="button" title="Eigenes Gericht zusammenstellen" aria-label="${r.name}, eigenes Gericht zusammenstellen">${PLUS_SVG}</button>`;
    el.querySelector('.add').addEventListener('click',()=>{picking.add(r.id);swapCustom(r,d,wrap)});
    return el;
  }
  el.className='block pick'+(d.sel[r.id]===b.id?' on':'');
  const have=new Set(b.items.map(x=>x[0]));let last=null;
  el.innerHTML=`<div class="pick-in"><div class="dish"></div>
    <ul class="shop-list pick-list">${PICK_ORDER.map(k=>{const g=opt(k).g||9;const gap=last!==null&&g!==last;last=g;const on=have.has(k);
      return `<li${gap?' class="gap"':''}><button type="button" data-f="${k}" aria-pressed="${on}"${on?' class="on"':''}><span>${esc(F[k][0])}</span><span>${fmt(defQty(k))} ${F[k][1]}</span></button></li>`}).join('')}</ul></div>`;
  paintDish(r,d,wrap,el);
  el.querySelectorAll('[data-f]').forEach(btn=>btn.addEventListener('click',()=>{
    const f=btn.dataset.f;const i=b.items.findIndex(x=>x[0]===f);
    if(i>=0)b.items.splice(i,1);else b.items.push([f,defQty(f)]);
    btn.classList.toggle('on',i<0);btn.setAttribute('aria-pressed',i<0);
    if(b.items.length&&d.sel[r.id]!==b.id){d.sel[r.id]=b.id;r.blocks.forEach(x=>{if(d.off[x.id]){delete d.off[x.id];paintBlock(x)}});markSel(wrap,r,d)}
    else if(!b.items.length&&d.sel[r.id]===b.id){d.sel[r.id]=null;markSel(wrap,r,d)}
    d.touched=true;saveDrafts();paintDish(r,d,wrap,el);totals();}));
  return el;
}
function paintDish(r,d,wrap,el){
  const b=customBlock(d,r.id);const m=mealFromDraft(d,b);const on=d.sel[r.id]===b.id;const has=b.items.length>0;
  const dish=el.querySelector('.dish');
  dish.innerHTML=`<div class="b-top"><button class="b-head" type="button" role="radio" aria-checked="${on}"><span class="box"></span><span class="b-name">${CUSTOM_NAME}</span></button>
      <button class="rst" type="button" title="Eigenes Gericht löschen" aria-label="${r.name}, eigenes Gericht löschen">${X_SVG}</button></div>
    <div class="b-meta">${has?`<span><b class="num" data-k>${fmt(m.kcal)}</b> kcal, <b class="num" data-p>${fmt(m.p)}</b> g Protein</span>`:'<span>Zutaten unten antippen</span>'}</div>
    ${has?itemsTable(m.items,true,b.id,true):''}`;
  dish.querySelector('.b-head').addEventListener('click',()=>{if(!b.items.length||d.sel[r.id]===b.id)return;
    d.sel[r.id]=b.id;r.blocks.forEach(x=>{if(d.off[x.id]){delete d.off[x.id];paintBlock(x)}});d.touched=true;markSel(wrap,r,d);paintDish(r,d,wrap,el);totals()});
  dish.querySelector('.rst').addEventListener('click',async()=>{if(d.sel[r.id]===b.id&&b.items.length&&!await confirmAlert(`Soll das Gericht aus ${r.name} entfernt werden?`,'Entfernen'))return;d.custom[r.id]=[];picking.delete(r.id);
    if(d.sel[r.id]===b.id)d.sel[r.id]=null;d.touched=true;saveDrafts();swapCustom(r,d,wrap);markSel(wrap,r,d);totals()});
  dish.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(isNaN(parseFloat(String(inp.value).replace(',','.'))))inp.value=b.items[+inp.dataset.i][1]}));
  dish.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',()=>{
    const v=parseFloat(String(inp.value).replace(',','.'));if(isNaN(v)||v<0)return;
    b.items[+inp.dataset.i][1]=v;d.touched=true;saveDrafts();paintBlock(b);totals();}));
}
function swapCustom(r,d,wrap){const el=customEl(r,d,wrap);document.getElementById('blk-x-'+r.id).replaceWith(el);
  el.scrollIntoView({block:'nearest',inline:'nearest'})}
// Pantry line in edit mode: always visible, text unchanged; the block-style checkbox shows and works only while the dish is selected (.block.on)
function paintVorrat(el,b,m){
  const v=el.querySelector('[data-v]');if(!v)return;
  v.innerHTML=m.items.filter(it=>it.v).map(it=>{const raw=itemCalc(it.f,it.q);const on=it.use!==0;
    return `<button type="button" class="vrow${on?' on':''}" role="checkbox" aria-checked="${on}" data-vi="${it.i}" tabindex="${el.classList.contains('on')?0:-1}"><span>Inklusive Vorrat: <span class="num">${fmt(it.q)}</span> ${it.u} ${esc(it.n)} (+<span class="num">${fmt(Math.round(raw.kcal))}</span> kcal)</span><span class="box"></span></button>`}).join('');
  v.querySelectorAll('.vrow').forEach(btn=>btn.addEventListener('click',()=>{if(!el.classList.contains('on'))return;const d=draftFor(cur);const o=(d.off[b.id]=d.off[b.id]||{});
    const i=btn.dataset.vi;if(o[i])delete o[i];else o[i]=true;if(!Object.keys(o).length)delete d.off[b.id];
    d.touched=true;saveDrafts();paintBlock(b);totals()}));
}
function paintBlock(b){
  const d=draftFor(cur);const el=document.getElementById('blk-'+b.id);if(!el)return;const m=mealFromDraft(d,b);
  el.querySelector('[data-k]').textContent=fmt(m.kcal);el.querySelector('[data-p]').textContent=fmt(m.p);
  m.items.forEach(it=>{const k=el.querySelector(`[data-ik="${it.i}"]`);if(k)k.textContent=fmt(Math.round(it.kcal));
    const h=el.querySelector(`[data-h="${it.i}"]`);if(h)h.innerHTML=numify(hintFor(it.f,it.q))});
  paintVorrat(el,b,m);
}

// ---------- Summen ----------
// Colour by distance to the 4.000 kcal goal: green from 3.850 (in range or above), soft red below 3.000, normal text in between
const kcalLevel=k=>k>=3850?'ok':k<3000?'low':'';
function totals(){
  const ms=currentMeals();let kcal=0,p=0,meat=0,meatc=0;ms.forEach(m=>{kcal+=m.kcal;p+=m.p;meat+=m.meat;meatc+=m.meatc||0});
  document.getElementById('tLbl').textContent=isEditing(cur)?'Auswahl':'Gespeichert';
  if(!isEditing(cur)&&!ms.length){['tKcal','tProt','tMeat','tMeatC'].forEach(id=>document.getElementById(id).textContent='–');
    document.getElementById('tMeter').style.width='0';const st=document.getElementById('tStatus');st.textContent='Nicht erfasst';st.className='status';return}
  document.getElementById('tKcal').textContent=fmt(kcal);
  document.getElementById('tProt').textContent=fmt(p);
  document.getElementById('tMeat').textContent=fmt(Math.round(meat/10)*10);
  document.getElementById('tMeatC').textContent=fmt(Math.round(meatc/10)*10);
  const mt=document.getElementById('tMeter');mt.style.width=Math.min(100,kcal/4600*100)+'%';mt.className=kcalLevel(kcal);
  const st=document.getElementById('tStatus');const d=Math.round(kcal-4000);
  st.className='status '+kcalLevel(kcal);
  st.innerHTML=numify(Math.abs(d)<=150?'Im Ziel':d<0?fmt(-d)+' kcal fehlen':fmt(d)+' kcal über Plan');
}

// ---------- Speichern ----------
async function saveDay(){
  const btn=document.getElementById('saveBtn');const msg=document.getElementById('saveMsg');
  const meals=currentMeals();
  const tot=meals.length?meals.reduce((a,m)=>({kcal:a.kcal+m.kcal,p:a.p+m.p,meat:a.meat+m.meat,meatc:a.meatc+m.meatc}),{kcal:0,p:0,meat:0,meatc:0}):{kcal:null,p:null,meat:null,meatc:null};
  const doc={v:1,date:cur,savedAt:new Date().toISOString(),total:tot,
    meals:meals.map(m=>({row:m.row,block:m.block,name:m.name,kcal:m.kcal,p:m.p,meat:m.meat,meatc:m.meatc,
      items:m.items.map(it=>({i:it.i,f:it.f,n:it.n,q:it.q,u:it.u,kcal:it.kcal,p:it.p,m:it.m,mc:it.mc,v:it.v,...(it.v?{use:it.use===0?0:1}:{})}))}))};
  btn.disabled=true;msg.className='';msg.textContent='Speichert …';
  try{
    if(db)await db.doc('days/'+cur).set(doc);
    store[cur]=doc;picking.clear();
    if(!db){persistLocal();fileSync()}
    delete drafts[cur];saveDrafts();editing.delete(cur);render();
  }catch(e){
    btn.disabled=false;msg.className='err';
    msg.textContent=e&&e.code==='quota_exceeded'?'Speicher voll, nichts gespeichert.':'Nicht gespeichert. Prüf die Verbindung und drück nochmal Speichern.';
  }
}

// ---------- Einkauf ----------
function unitOut(q,u){if(u==='Stk')return fmt(Math.ceil(q-1e-9))+' Stk';
  if(u==='g'&&q>=1000)return fmt(q/1000,2)+' kg';if(u==='ml'&&q>=1000)return fmt(q/1000,2)+' l';return fmt(Math.round(q))+' '+u}
let shopText='';
function renderShop(){
  const buy={},pan={};
  currentMeals().forEach(m=>m.items.forEach(it=>{if(it.v&&it.use===0)return;const t=it.v?pan:buy;t[it.f]=(t[it.f]||0)+it.q}));
  const keys=Object.keys(buy).filter(k=>F[k]).sort((a,b)=>(opt(a).g||9)-(opt(b).g||9)||F[a][0].localeCompare(F[b][0],'de'));
  const ul=document.getElementById('shopList');ul.innerHTML='';const lines=[];let lastG=null;
  keys.forEach(k=>{const g=opt(k).g||9;const li=document.createElement('li');if(lastG!==null&&g!==lastG){li.className='gap';lines.push('')}
    lastG=g;const s=unitOut(buy[k],F[k][1]);li.innerHTML=`<span>${esc(F[k][0])}</span><span>${s}</span>`;ul.appendChild(li);lines.push(`${F[k][0]} ${s}`)});
  if(!keys.length)ul.innerHTML='<li><span>Für diesen Tag ist noch nichts ausgewählt.</span><span></span></li>';
  const pv=Object.keys(pan).filter(k=>F[k]).map(k=>`${F[k][0]} ${unitOut(pan[k],F[k][1])}`);
  document.getElementById('shopVorrat').textContent=pv.length?'Aus dem Vorrat: '+pv.join(', '):'';
  shopText=lines.join('\n');
}

// ---------- Export ----------
const CSV_HEAD=['Datum','Wochentag','Mahlzeit','Gericht','Zutat','Menge','Einheit','kcal','Protein_g','Fleisch_Fisch_roh_g','Fleisch_Fisch_gekocht_g','Vorrat','Vorrat_genutzt','Tag_kcal','Tag_Protein_g','Tag_Fleisch_Fisch_roh_g','Tag_Fleisch_Fisch_gekocht_g'];
const dec=n=>String(n).replace('.',',');
const cell=s=>{s=String(s);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
// Every day from START to today; a day without saved meals is one row with only date and weekday (NULL), never 0.
// Meat columns are recomputed from the current catalog so older records follow the same rule; unknown foods fall back to the stored values.
const val=n=>n==null?'':n;
const meatCsv=it=>F[it.f]?meatOf(it.f,it.q):{m:it.m||0,mc:it.mc!=null?it.mc:(it.m||0)};
function buildCsv(){
  const rows=[CSV_HEAD.join(';')];
  dayList().forEach(date=>{const s=store[date];const wd=WD[parseIso(date).getDay()];
    const meals={};(s&&s.meals||[]).forEach(m=>meals[m.row]=m);
    const tk=s&&s.total?val(s.total.kcal):'',tp=s&&s.total?val(s.total.p):'';
    if(!ROWS.some(r=>meals[r.id]&&meals[r.id].items.length)){rows.push([date,wd,...CSV_HEAD.slice(2).map(()=>'')].map(cell).join(';'));return}
    let dm=0,dmc=0;ROWS.forEach(r=>{const m=meals[r.id];if(m)m.items.forEach(it=>{const x=meatCsv(it);dm+=x.m;dmc+=x.mc})});
    ROWS.forEach(r=>{const m=meals[r.id];if(!m)return;
      m.items.forEach(it=>{const x=meatCsv(it);rows.push([date,wd,r.name,m.name,it.n,dec(it.q),it.u,dec(it.kcal),dec(it.p),x.m,x.mc,it.v?'ja':'nein',it.v?(it.use===0?'nein':'ja'):'',tk,tp,dm,dmc].map(cell).join(';'))})});});
  return '﻿'+rows.join('\r\n');
}
function renderExport(){
  const days=dayList(),n=days.filter(x=>store[x]).length;
  document.getElementById('expSub').innerHTML=numify(`${days.length} ${days.length===1?'Tag':'Tage'} von ${dayLabel(days[0])} bis ${dayLabel(days[days.length-1])}, davon ${n} gespeichert`);
  const last=Object.values(store).filter(x=>x&&x.savedAt).sort((a,b)=>a.savedAt<b.savedAt?1:-1)[0];
  document.getElementById('expLast').innerHTML=last?numify('Zuletzt '+savedText(last).replace('Gespeichert','gespeichert')+', Eintrag für '+dayLabel(last.date)):'Noch nichts gespeichert';
  document.getElementById('csvBox').value=buildCsv().replace('﻿','');
  document.getElementById('expMsg').textContent='';
}

// ---------- Datei-Speicher (lokale HTML) ----------
// Outside claude.ai the page keeps a full copy of every saved day inside its own HTML file (JSON block #ebk-data).
// Written on every save and reset via the File System Access API (Chrome/Edge desktop); the file handle is kept in IndexedDB.
const LS_UPD='ebk-days-updated';
const DATA_RE=/(<script type="application\/json" id="ebk-data">)([\s\S]*?)(<\/script>)/;
let storeUpdated=0,fileHandle=null;
function parseData(txt){try{const j=JSON.parse(txt||'{}');return {days:j.days||{},updatedAt:j.updatedAt?Date.parse(j.updatedAt):0}}catch(e){return {days:{},updatedAt:0}}}
function readEmbedded(){const el=document.getElementById('ebk-data');return parseData(el&&el.textContent)}
function persistLocal(ts){storeUpdated=ts||Date.now();try{localStorage.setItem(LS_DAYS,JSON.stringify(store));localStorage.setItem(LS_UPD,String(storeUpdated))}catch(e){}}
function idb(mode,fn){return new Promise((res,rej)=>{const r=indexedDB.open('ebk',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');
  r.onerror=()=>rej(r.error);r.onsuccess=()=>{const tx=r.result.transaction('kv',mode);const q=fn(tx.objectStore('kv'));tx.oncomplete=()=>res(q.result);tx.onerror=()=>rej(tx.error)}})}
const idbGet=k=>idb('readonly',st=>st.get(k)), idbSet=(k,v)=>idb('readwrite',st=>st.put(v,k));
const isAppFile=t=>DATA_RE.test(t)&&t.includes('const ROWS');
function fileNote(state){
  const n=document.getElementById('dbNote');
  const T={none:['Tage werden nur in diesem Browser gespeichert.',''],
    off:['Tage liegen bisher nur in diesem Browser.','In HTML-Datei speichern'],
    perm:['Die HTML-Datei braucht nach dem Neuladen einmal deine Freigabe.','Freigeben'],
    wrong:['Das war nicht die Datei Essensbaukasten.html.','Datei wählen'],
    err:['Speichern in die HTML-Datei hat nicht geklappt.','Nochmal verbinden']}[state];
  if(!T){n.hidden=true;n.innerHTML='';return}
  n.hidden=false;n.innerHTML=`<span>${T[0]}</span>${T[1]?`<button class="tbtn" type="button">${T[1]}</button>`:''}`;
  const b=n.querySelector('button');if(b)b.addEventListener('click',()=>connectFile(state==='perm'));
}
async function fileSync(){
  if(!fileHandle)return;
  try{
    if(await fileHandle.queryPermission({mode:'readwrite'})!=='granted'){fileNote('perm');return}
    const text=await (await fileHandle.getFile()).text();
    if(!isAppFile(text)){fileNote('wrong');return}
    const json=JSON.stringify({v:1,updatedAt:new Date(storeUpdated||Date.now()).toISOString(),days:store}).replace(/</g,'\\u003c');
    const w=await fileHandle.createWritable();await w.write(text.replace(DATA_RE,(m,a,c,b)=>a+json+b));await w.close();
    fileNote('ok');
  }catch(e){fileNote('err')}
}
async function adoptFile(){
  const text=await (await fileHandle.getFile()).text();
  if(!isAppFile(text)){fileNote('wrong');return}
  const f=parseData(text.match(DATA_RE)[2]);
  if(f.updatedAt>storeUpdated){applyStore(f.days);persistLocal(f.updatedAt);fileNote('ok')}else await fileSync();
}
async function connectFile(reuse){
  try{
    if(reuse&&fileHandle&&await fileHandle.requestPermission({mode:'readwrite'})==='granted'){await adoptFile();return}
    const [h]=await showOpenFilePicker({types:[{description:'Essensbaukasten',accept:{'text/html':['.html']}}],multiple:false});
    if(!isAppFile(await (await h.getFile()).text())){fileNote('wrong');return}
    if(await h.requestPermission({mode:'readwrite'})!=='granted'){fileNote('perm');return}
    fileHandle=h;try{await idbSet('file',h)}catch(e){}
    await adoptFile();
  }catch(e){if(!e||e.name!=='AbortError')fileNote('err')}
}
async function initFile(){
  if(!window.showOpenFilePicker){fileNote('none');return}
  try{fileHandle=(await idbGet('file'))||null}catch(e){fileHandle=null}
  if(!fileHandle){fileNote('off');return}
  try{if(await fileHandle.queryPermission({mode:'readwrite'})==='granted')await adoptFile();else fileNote('perm')}catch(e){fileNote('err')}
}

let sb=null,lastWrite=0,loadSeq=0;
function loadScript(src){return new Promise((res,rej)=>{const el=document.createElement('script');el.src=src;el.onload=res;el.onerror=rej;document.head.appendChild(el)})}
// Adapter with the surface the page already uses for claude.ai's db: doc(path).set/delete, collection().onSnapshot
function supaDb(uid){
  return {
    doc(path){const date=path.split('/')[1];return {
      async set(doc){lastWrite=Date.now();const {error}=await sb.from('days').upsert({user_id:uid,date,doc,updated_at:new Date().toISOString()});if(error)throw error},
      async delete(){lastWrite=Date.now();const {error}=await sb.from('days').delete().eq('user_id',uid).eq('date',date);if(error)throw error}}},
    collection(){return {onSnapshot(cb,onErr){
      const load=async()=>{const n=++loadSeq,t0=Date.now();const {data,error}=await sb.from('days').select('date,doc');if(n!==loadSeq||t0<lastWrite)return;if(error){if(onErr)onErr(error);return}
        cb({docs:data.map(r=>({id:r.date,data:()=>r.doc}))})};
      load();setInterval(()=>{if(!document.hidden)load()},60000);
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});}}}
  };
}

    if(error){showLogin('Anmeldung fehlgeschlagen. Prüf E-Mail und Passwort.');return}

function startCloud(uid){

  let legacy={};try{if(!localStorage.getItem(LS_MIGRATED))legacy=JSON.parse(localStorage.getItem(LS_DAYS)||'{}')||{}}catch(e){}
  db=supaDb(uid);useLocal=false;
  const n=document.getElementById('dbNote');n.hidden=true;n.innerHTML='';
  let first=true;
  db.collection('days').onSnapshot(async snap=>{const next={};snap.docs.forEach(d=>{const v=d.data();if(v&&v.total)next[d.id]=v});
      if(first){first=false;
        for(const k of Object.keys(legacy).filter(k=>!next[k]&&legacy[k]&&legacy[k].total)){try{await db.doc('days/'+k).set(legacy[k]);next[k]=legacy[k]}catch(e){}}
        try{localStorage.setItem(LS_MIGRATED,'1')}catch(e){}}
      applyStore(next);persistLocal();},
    ()=>{n.hidden=false;n.textContent='Gespeicherte Tage konnten nicht geladen werden. Lade die Seite neu.'});
}

// ---------- Update-Check ----------
// BUILD is replaced by kcal_sync.py on every deploy. The online page compares it with the freshly fetched index.html
// (GitHub Pages caches for 10 minutes) and reloads once when a newer version is out.
const BUILD='5e32087badce';
async function checkUpdate(){
  if(BUILD==='local'||location.protocol!=='https:')return;
  try{const t=await (await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'})).text();const m=t.match(/const BUILD='([^']+)'/);
    if(m&&m[1]!==BUILD&&sessionStorage.getItem('ebk-reloaded')!==m[1]){sessionStorage.setItem('ebk-reloaded',m[1]);location.reload()}}catch(e){}
}
checkUpdate();document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});

// ---------- Start ----------
render();

function applyStore(next){
  if(JSON.stringify(next)===JSON.stringify(store))return;
  const wasEditing=isEditing(cur);
  store=next;
  // Ein unberührter Entwurf für einen gespeicherten Tag wird verworfen, damit der gespeicherte Stand gilt
  Object.keys(store).forEach(dt=>{if(drafts[dt]&&!drafts[dt].touched&&!editing.has(dt)){delete drafts[dt]}
    else if(drafts[dt]&&drafts[dt].touched&&!editing.has(dt)&&dt===cur){editing.add(dt)}});
  if(isEditing(cur)&&wasEditing){renderDays();totals()}else render();
}
(async()=>{
  const c=window.claude;
  try{dl=c&&c.use?await c.use('downloads'):null}catch(e){dl=null}
  try{db=c&&c.use?await c.use('db'):null}catch(e){db=null}
  if(!db){
    // First paint from the newer local copy: the data block inside this HTML file or this browser's localStorage
    const emb=readEmbedded();let loc={},lu=0;
    try{loc=JSON.parse(localStorage.getItem(LS_DAYS)||'{}')||{};lu=+localStorage.getItem(LS_UPD)||0}catch(e){}
    if(emb.updatedAt>lu){storeUpdated=emb.updatedAt;applyStore(emb.days);persistLocal(emb.updatedAt)}else{storeUpdated=lu;applyStore(loc)}
    if(CLOUD.url&&CLOUD.key){initCloud();return}
    useLocal=true;initFile();
    return;
  }
  db.collection('days').onSnapshot(snap=>{const next={};snap.docs.forEach(d=>{const v=d.data();if(v&&v.total)next[d.id]=v});applyStore(next)},
    err=>{const n=document.getElementById('dbNote');n.hidden=false;n.textContent='Gespeicherte Tage konnten nicht geladen werden. Lade die Seite neu.'});
})();
